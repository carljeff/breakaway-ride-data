name: Sync Breakaway ride data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Run at both possible offsets, then continue only
    # when it is 10:00 a.m. in America/New_York (EDT or EST).
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: sync-breakaway-rides
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check Eastern time
        id: eastern
        run: |
          if [ "$(TZ=America/New_York date +%H)" = "10" ]; then
            echo "is_ten=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_ten=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || steps.eastern.outputs.is_ten == 'true'
      - name: Fetch privacy-filtered ride data
        if: github.event_name == 'workflow_dispatch' || steps.eastern.outputs.is_ten == 'true'
        run: |
          mkdir -p data
          curl --fail --silent --show-error --retry 3 \
            "https://jeffs-cycling-progress.carl-jeff.chatgpt.site/api/chat/rides/latest" \
            --output data/latest.json
          curl --fail --silent --show-error --retry 3 \
            "https://jeffs-cycling-progress.carl-jeff.chatgpt.site/api/chat/rides/recent?limit=20" \
            --output data/recent.json
          jq -e '.privacy.gpsCoordinatesIncluded == false and .privacy.routeTraceIncluded == false and .privacy.credentialsIncluded == false' data/latest.json >/dev/null
          jq -e '.privacy.gpsCoordinatesIncluded == false and .privacy.routeTraceIncluded == false and .privacy.credentialsIncluded == false' data/recent.json >/dev/null
      - name: Publish updated snapshots
        if: github.event_name == 'workflow_dispatch' || steps.eastern.outputs.is_ten == 'true'
        run: |
          git config user.name "breakaway-data-bot"
          git config user.email "breakaway-data-bot@users.noreply.github.com"
          git add data/latest.json data/recent.json
          git diff --cached --quiet || git commit -m "Update Breakaway ride data"
          git push
